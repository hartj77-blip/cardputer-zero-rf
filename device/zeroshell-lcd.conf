# ZeroOS RF: draw on the built-in LCD, wherever it is.
#
# The base image points ZeroShell at /dev/fb0, but on the Cardputer Zero fb0
# is usually HDMI and the LCD is fb1 (/dev/fb_lcd), so the screen stayed
# blank. M5's fb_load also holds the LCD for its boot logo until M5's own
# launcher starts, which never happens on this image, so it is stopped first.
[Service]
ExecStartPre=-+/usr/bin/pkill -x fb_load
ExecStart=
ExecStart=/bin/sh -c 'ZS_FRAMEBUFFER=$$(/usr/bin/zeroos-lcd-fb) exec /usr/bin/zeroshell'
