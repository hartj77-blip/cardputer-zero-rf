name: Build image

# Builds the flashable ZeroOS RF .img.xz: the base ZeroOS image with the RF
# home screen and radio programs already installed. It takes 1.5 to 3 hours
# (an x86 runner builds the arm64 system under qemu), so it only runs by hand
# from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      wifi_country:
        description: Wi-Fi country code (regulatory domain)
        default: US
        required: true
      compression:
        description: "fast: quicker build, larger file (for testing). small: smallest file (for releases)."
        type: choice
        options: [fast, small]
        default: fast

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  programs:
    name: Device programs (arm64)
    runs-on: ubuntu-24.04-arm
    # Built on Debian trixie, the system in the image: its RTL-SDR library has
    # a different name from Ubuntu's, and a program linked to one won't start
    # on the other.
    container: debian:trixie
    env:
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the base OS
        run: |
          git config --global --add safe.directory "$PWD"
          if git submodule update --init --depth 1 base 2>/dev/null; then exit 0; fi
          if [ -z "$BASE_REPO_TOKEN" ]; then
            echo "::error::The base OS repository can't be fetched. Add the BASE_REPO_TOKEN secret (see README.md)."
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$BASE_REPO_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            submodule update --init --depth 1 base
      - name: Install build tools
        run: apt-get install -y cmake g++ pkg-config librtlsdr-dev binutils file
      - name: Build
        run: |
          cmake -S shell -B build/device -DZS_BACKEND=device -DCMAKE_CXX_FLAGS=-mcpu=cortex-a53 -DCMAKE_C_FLAGS=-mcpu=cortex-a53
          cmake --build build/device -j"$(nproc)"
          build/device/rf/test_dsp
          strip build/device/zeroshell build/device/rf/zrfd build/device/rf/zrf build/device/rf/zrf-sim-*
      - uses: actions/upload-artifact@v4
        with:
          name: device-programs
          path: |
            build/device/zeroshell
            build/device/rf/zrfd
            build/device/rf/zrf
            build/device/rf/zrf-sim-sensors
            build/device/rf/zrf-sim-aircraft
            build/device/rf/zrf-sim-aprs

  image:
    name: SD card image
    needs: programs
    # Native arm64 (free for public repositories): the arm64 system is built
    # without qemu emulation, the slow part of the build on an x86 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # git describe for the version string
      - name: Fetch the base OS
        run: |
          if git submodule update --init --depth 1 base 2>/dev/null; then exit 0; fi
          if [ -z "$BASE_REPO_TOKEN" ]; then
            echo "::error::The base OS repository can't be fetched. Add the BASE_REPO_TOKEN secret (see README.md)."
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$BASE_REPO_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            submodule update --init --depth 1 base
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Install dependencies
        # The same list the base image workflow uses.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coreutils quilt parted debootstrap zerofree zip dosfstools libarchive-tools \
            libcap2-bin grep rsync xz-utils file git curl bc gpg pigz xxd arch-test \
            qemu-user-static kmod binfmt-support e2fsprogs
          # qemu-user-static only because pi-gen's dependency list names it.
          uname -m
      - name: Check our package names (fast fail)
        # Resolve the RF stage's package list in a trixie arm64 container before
        # the long base build starts.
        run: |
          pkgs=$(grep -v '^#' image/stage-zeroos-rf/00-packages | tr '\n' ' ')
          docker run --rm --platform linux/arm64 debian:trixie sh -euc "
            apt-get update -qq
            apt-get install -s $pkgs > /tmp/plan.txt
            grep -c '^Inst' /tmp/plan.txt"
      - uses: actions/download-artifact@v4
        with:
          name: device-programs
          path: build/device
      - name: Build image
        env:
          WIFI_COUNTRY: ${{ inputs.wifi_country || 'US' }}
          PIGEN_NATIVE: 1
          # xz level: 1 is several times faster than 6, for a larger file. The
          # base builder passes it on from cardputer-zero's faster-image-builds.
          COMPRESSION_LEVEL: ${{ inputs.compression == 'small' && '6' || '1' }}
        run: |
          chmod +x build/device/zeroshell build/device/rf/*
          image/build.sh build/device
      - name: Image contents check
        run: |
          ls -la build/image/pi-gen/deploy/
          sudo tail -40 build/image/pi-gen/deploy/build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeroos-rf-image
          path: |
            build/image/pi-gen/deploy/*.img.xz
            build/image/pi-gen/deploy/*.info
            build/image/pi-gen/deploy/build.log
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
