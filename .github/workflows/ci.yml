name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rf:
    name: Radio core (build and test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config librtlsdr-dev
      - name: Build
        run: |
          cmake -S rf -B build/rf -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build/rf -j
      - name: Test
        run: ctest --test-dir build/rf --output-on-failure

  shell:
    name: RF shell (build and screenshots)
    runs-on: ubuntu-24.04
    env:
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The base OS is a private repository. Without a read token for it this
      # job can only skip; see README.md.
      - name: Fetch the base OS
        id: base
        run: |
          if git submodule update --init --depth 1 base 2>/dev/null; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_REPO_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$BASE_REPO_TOKEN" | base64 -w0)
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              submodule update --init --depth 1 base
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BASE_REPO_TOKEN is not set, so the base OS can't be fetched. The RF shell was not built."
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.base.outputs.have == '1'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libsdl2-dev librtlsdr-dev python3-pil libhamlib-utils
      - name: Build SDL simulator (compile check)
        if: steps.base.outputs.have == '1'
        run: cmake -S shell -B build/sim -DZS_BACKEND=sim && cmake --build build/sim -j"$(nproc)"
      - name: Build headless
        if: steps.base.outputs.have == '1'
        run: cmake -S shell -B build/headless -DZS_BACKEND=headless && cmake --build build/headless -j"$(nproc)"
      - name: Render the RF screens (fails if the app crashes)
        if: steps.base.outputs.have == '1'
        run: shell/tools/screenshots.sh build/headless build/screenshots
      - name: RF apps as the installable module rf.so (fails if it won't load or an app crashes)
        if: steps.base.outputs.have == '1'
        run: |
          cmake -S shell -B build/modules -DZS_BACKEND=headless -DZS_APPS_AS_MODULES=ON
          cmake --build build/modules -j"$(nproc)"
          cmake --build build/modules --target zeroshell -j"$(nproc)"
          PATH="$PWD/build/modules/rf:$PATH" base/shell/tools/modules-test.sh build/modules \
            spectrum scanner sensors aircraft aprs ft8 logbook sdrserver station
      - uses: actions/upload-artifact@v4
        if: steps.base.outputs.have == '1'
        with:
          name: screenshots
          path: build/screenshots

  device:
    name: RF app and device kit (arm64)
    runs-on: ubuntu-24.04-arm
    # Built on the system the device runs, not on the runner's Ubuntu: the two
    # ship the RTL-SDR library under different names (librtlsdr.so.0 on Debian
    # trixie, .so.2 on Ubuntu), and a program linked to one won't start on the
    # other.
    container: debian:trixie
    env:
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the base OS
        id: base
        run: |
          git config --global --add safe.directory "$PWD"
          if git submodule update --init --depth 1 base 2>/dev/null; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_REPO_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$BASE_REPO_TOKEN" | base64 -w0)
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              submodule update --init --depth 1 base
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BASE_REPO_TOKEN is not set: the kit holds the radio programs only, without the home screen."
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build tools
        run: apt-get install -y cmake g++ pkg-config librtlsdr-dev binutils file
      - name: Build the RF app (rf.so and the radio programs)
        if: steps.base.outputs.have == '1'
        run: |
          cmake -S shell -B build/device -DZS_BACKEND=device -DCMAKE_CXX_FLAGS=-mcpu=cortex-a53 -DCMAKE_C_FLAGS=-mcpu=cortex-a53
          cmake --build build/device -j"$(nproc)"
          build/device/rf/test_dsp
      # The app for ZeroOS: the Apps app installs it from a release; try this
      # build with: sudo zeroos-apps install-file zeroos-app-rf_*.deb
      - name: Pack the RF app
        if: steps.base.outputs.have == '1'
        run: |
          apt-get install -y dpkg-dev
          git config --global --add safe.directory "$PWD/base"
          app/build.sh build/device build/app
      - uses: actions/upload-artifact@v4
        if: steps.base.outputs.have == '1'
        with:
          name: zeroos-app-rf
          path: build/app/
      # The RF apps in the device build of ZeroShell, with a fake screen and
      # keyboard (base/shell/tests/device): each opened from the home screen,
      # keys pressed, Esc back. Once with simulated hardware, once with the
      # device's hardware layer and no dongle plugged in.
      - name: Open every RF app with the keyboard, with and without a dongle
        if: steps.base.outputs.have == '1'
        run: |
          apt-get install -y python3 python3-pil gcc
          cmake --build build/device --target zeroshell -j"$(nproc)"
          gcc -shared -fPIC -o build/fakedev.so base/shell/tests/device/fakedev.c -ldl
          python3 base/shell/tests/device/apps_test.py build/device/zeroshell build/fakedev.so build/rf-screens \
            --apps build/device/apps --path build/device/rf --settle 4 \
            --expect spectrum,scanner,sensors,aircraft,aprs,ft8,logbook,sdrserver,station
      - uses: actions/upload-artifact@v4
        if: always() && steps.base.outputs.have == '1'
        with:
          name: rf-app-screens
          path: build/rf-screens
      # The package the Apps app downloads, installed with the real apt on
      # Debian trixie arm64 (what the Cardputer runs), then removed.
      - name: Install and remove the RF app for real
        if: steps.base.outputs.have == '1'
        run: base/image/tests/apps-install-test.sh build/app build/device/zeroshell
      # The kit for M5's stock image: a ZeroShell with every app built in.
      - name: Build the kit's home screen
        if: steps.base.outputs.have == '1'
        run: |
          cmake -S shell -B build/kit -DZS_BACKEND=device -DZS_APPS_AS_MODULES=OFF -DCMAKE_CXX_FLAGS=-mcpu=cortex-a53 -DCMAKE_C_FLAGS=-mcpu=cortex-a53
          cmake --build build/kit -j"$(nproc)"
      - name: Build radio programs only
        if: steps.base.outputs.have != '1'
        run: |
          cmake -S rf -B build/device -DCMAKE_CXX_FLAGS=-mcpu=cortex-a53
          cmake --build build/device -j"$(nproc)"
          build/device/test_dsp
      - name: Pack the kit
        run: |
          [ -d build/kit ] && kit=build/kit || kit=build/device
          tools/package-device.sh "$kit" build/zeroos-rf-arm64.tar.gz
      - name: The packed radio program starts on this system
        run: |
          tar -xzf build/zeroos-rf-arm64.tar.gz -C /tmp
          /tmp/zeroos-rf/bin/zrfd --help
          /tmp/zeroos-rf/bin/zrf 2>&1 | grep -q usage
      - uses: actions/upload-artifact@v4
        with:
          name: zeroos-rf-arm64
          path: build/zeroos-rf-arm64.tar.gz
